name: Update competitive deck catalog

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      page:
        description: "MTGTop8 page to import (0 is the newest page)"
        required: false
        default: "0"
        type: string
      events:
        description: "Maximum events to inspect"
        required: false
        default: "5"
        type: string
      decks:
        description: "Maximum decks to import"
        required: false
        default: "24"
        type: string
      dry_run:
        description: "Fetch and validate without committing catalog files"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-deck-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CATALOG_PAGE: ${{ inputs.page || '0' }}
      CATALOG_EVENTS: ${{ inputs.events || '5' }}
      CATALOG_DECKS: ${{ inputs.decks || '24' }}
      CATALOG_DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Validate catalog tools
        run: node --test tools/deck-catalog/tests/*.test.mjs

      - name: Synchronize bounded catalog slice
        shell: bash
        run: |
          args=(--page "$CATALOG_PAGE" --events "$CATALOG_EVENTS" --limit "$CATALOG_DECKS")
          if [[ "$CATALOG_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          node tools/deck-catalog/sync.mjs "${args[@]}"

      - name: Check generated files
        if: env.CATALOG_DRY_RUN != 'true'
        run: git diff --check

      - name: Commit catalog update
        if: env.CATALOG_DRY_RUN != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if git diff --cached --quiet; then
            echo "Catalog is already up to date"
            exit 0
          fi
          git commit -m "Update competitive deck catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
