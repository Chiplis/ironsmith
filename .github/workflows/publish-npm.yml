name: Publish ironsmith-wasm

on:
  push:
    tags:
      - "ironsmith-wasm-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current Cargo version after verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ironsmith-wasm
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install release tools
        run: |
          rustup target add wasm32-unknown-unknown
          # The CLI must match the wasm-bindgen crate version in Cargo.lock.
          bindgen_version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          cargo install wasm-bindgen-cli --version "$bindgen_version" --locked
          npm install --global npm@11.5.1 vite@7.3.1 esbuild@0.27.3

      # The optimized engine build exceeds the hosted runner's RAM; without
      # extra swap the runner is shut down mid-compile.
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt

      - name: Build lean npm artifact
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/ironsmith-wasm-v* ]]; then
            args+=(--expected-version "${GITHUB_REF_NAME#ironsmith-wasm-v}")
          fi
          node scripts/build-npm-package.mjs "${args[@]}"

      - name: Verify package and consumer
        run: node scripts/verify-npm-package.mjs

      - name: Publish with provenance
        if: startsWith(github.ref, 'refs/tags/ironsmith-wasm-v') || inputs.publish
        run: npm publish ./target/npm/ironsmith-wasm --access public
