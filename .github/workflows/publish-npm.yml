name: Publish ironsmith-wasm

on:
  push:
    tags:
      - "ironsmith-wasm-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current Cargo version after verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ironsmith-wasm
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install release tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
          npm install --global npm@11.5.1 vite@7.3.1

      - name: Build lean npm artifact
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/ironsmith-wasm-v* ]]; then
            args+=(--expected-version "${GITHUB_REF_NAME#ironsmith-wasm-v}")
          fi
          node scripts/build-npm-package.mjs "${args[@]}"

      - name: Verify package and consumer
        run: node scripts/verify-npm-package.mjs

      - name: Publish with provenance
        if: startsWith(github.ref, 'refs/tags/ironsmith-wasm-v') || inputs.publish
        run: npm publish ./target/npm/ironsmith-wasm --access public
        # This secret is only needed to create the package on its first release.
        # Once npm trusts this workflow, npm 11.5.1 prefers GitHub's OIDC token;
        # deleting NPM_TOKEN leaves this as a tokenless trusted publish.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
