[package]
autotests = false
name = "ironsmith-compiler-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
ironsmith = { package = "ironsmith-engine", path = "../ironsmith-engine", default-features = false, features = ["compiler-bridge"] }
ironsmith-runtime-catalog = { path = "../ironsmith-runtime-catalog", default-features = false }
ironsmith-compiled-artifact = { path = "../ironsmith-compiled-artifact", default-features = false }
ironsmith-compiler = { path = "../ironsmith-compiler", default-features = false }
ironsmith-text = { path = "../ironsmith-text", default-features = false }
ironsmith-core = { path = "../ironsmith-core" }
serde_json = "1.0.149"

[lib]
path = "src/lib.rs"

[features]
default = []

