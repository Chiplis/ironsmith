[package]
name = "ironsmith-card-catalog"
version = "0.1.0"
edition = "2024"

[features]
default = []
build = ["dep:brotli", "dep:sha2"]

[dependencies]
brotli-decompressor = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
brotli = { version = "8.0", optional = true }
sha2 = { version = "0.11", optional = true }

[[bin]]
name = "build_card_catalog"
path = "src/bin/build_card_catalog.rs"
required-features = ["build"]
