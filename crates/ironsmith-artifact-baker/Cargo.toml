[package]
name = "ironsmith-artifact-baker"
version = "0.1.0"
edition = "2024"

[dependencies]
ironsmith-compiled-artifact = { path = "../ironsmith-compiled-artifact", default-features = false }
ironsmith-compiler = { path = "../ironsmith-compiler", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[features]
default = []

[[bin]]
name = "bake_card_artifacts"
path = "src/main.rs"
