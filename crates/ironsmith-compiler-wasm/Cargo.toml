[package]
name = "ironsmith-compiler-wasm"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
ironsmith-compiled-artifact = { path = "../ironsmith-compiled-artifact", default-features = false }
ironsmith-compiler = { path = "../ironsmith-compiler", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
wasm-bindgen = "0.2.120"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
