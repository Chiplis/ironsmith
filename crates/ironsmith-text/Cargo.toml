[package]
name = "ironsmith-text"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
ironsmith-compiled-artifact = { path = "../ironsmith-compiled-artifact", default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
engine = { package = "ironsmith-engine", path = "../ironsmith-engine", default-features = false }
ironsmith-core = { path = "../ironsmith-core", default-features = false }
memchr = "2.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1.23"

[dev-dependencies]
ironsmith-compiler = { path = "../ironsmith-compiler", default-features = false, features = ["serialization"] }
ironsmith-runtime-catalog = { path = "../ironsmith-runtime-catalog", default-features = false }

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ironsmith_runtime_parser_tests)"] }

[lib]
path = "src/lib.rs"
