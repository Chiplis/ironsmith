[package]
name = "ironsmith-cli"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
ironsmith = { package = "ironsmith-runtime", path = "../ironsmith-runtime", default-features = false, features = ["serialization"] }
ironsmith-registry = { path = "../ironsmith-registry", default-features = false }
ironsmith-compiler = { path = "../ironsmith-compiler", default-features = false }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[bin]]
name = "ironsmith"
path = "src/main.rs"
test = false
