[package]
name = "ironsmith-oracle-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Compiler-only Oracle compatibility checks for browser workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ironsmith-compiler = { path = "../ironsmith-compiler", default-features = false }
ironsmith-compiler-api = { path = "../ironsmith-compiler-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
