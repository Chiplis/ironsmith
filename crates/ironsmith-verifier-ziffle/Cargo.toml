[package]
name = "ironsmith-verifier-ziffle"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
ark-secp256k1 = { version = "0.5.0", default-features = false }
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
ziffle = { path = "../../vendor/ziffle" }

[lib]
path = "src/lib.rs"

[features]
default = []
