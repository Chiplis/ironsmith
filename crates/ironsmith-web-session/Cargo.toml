[package]
name = "ironsmith-web-session"
version = "0.1.2"
edition = "2024"
build = "build.rs"
autotests = false

[dependencies]
ironsmith-core = { path = "../ironsmith-core", default-features = false }
ironsmith-compiled-artifact = { path = "../ironsmith-compiled-artifact", default-features = false }
ironsmith-card-catalog = { path = "../ironsmith-card-catalog" }
ironsmith = { package = "ironsmith-engine", path = "../ironsmith-engine", default-features = false }
ironsmith-runtime-catalog = { path = "../ironsmith-runtime-catalog", default-features = false }
ironsmith-dynamic-compile = { path = "../ironsmith-dynamic-compile", default-features = false, optional = true }
manabrew-protocol = { path = "../../vendor/manabrew-protocol", version = "3.0.0" }
rand = "0.10.1"
rand_chacha = "0.10.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.11"
ts-rs = { version = "10.1.0", features = ["no-serde-warnings"] }
wasm-bindgen = "0.2.120"
js-sys = "0.3.97"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[lib]
path = "../ironsmith-wasm/src/lib.rs"
crate-type = ["rlib"]
doctest = false

[features]
default = ["generated-registry", "dynamic-compile"]
generated-registry = ["ironsmith/generated-registry"]
dynamic-compile = ["dep:ironsmith-dynamic-compile", "dep:ironsmith-card-source-build", "dep:ironsmith-compiler-runtime-build"]
wasm = ["ironsmith/wasm"]
wasm-lean = ["ironsmith/wasm-lean"]
shadow-continuous = ["ironsmith/shadow-continuous"]
paranoid-invariants = ["ironsmith/paranoid-invariants"]

[dev-dependencies]
ironsmith-compiler = { path = "../ironsmith-compiler", default-features = false }
ironsmith-compiler-runtime-build = { package = "ironsmith-compiler-runtime", path = "../ironsmith-compiler-runtime", default-features = false }
ironsmith-card-catalog = { path = "../ironsmith-card-catalog", features = ["build"] }
ironsmith-registry-test = { package = "ironsmith-registry", path = "../ironsmith-registry", default-features = false, features = ["handwritten-parse-support"] }
ironsmith-tools = { path = "../ironsmith-tools", default-features = false }

[build-dependencies]
ironsmith-card-source-build = { package = "ironsmith-card-source", path = "../ironsmith-card-source", optional = true }
ironsmith-compiler-runtime-build = { package = "ironsmith-compiler-runtime", path = "../ironsmith-compiler-runtime", default-features = false, optional = true }
serde_json = "1.0.149"
ironsmith-core = { path = "../ironsmith-core", default-features = false }
