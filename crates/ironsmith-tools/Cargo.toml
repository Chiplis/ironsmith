[package]
autotests = false
name = "ironsmith-tools"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
autobins = false

[dependencies]
ironsmith = { package = "ironsmith-runtime", path = "../ironsmith-runtime", default-features = false, features = ["serialization", "analysis", "compiler-bridge"] }
ironsmith-registry = { path = "../ironsmith-registry", default-features = false }
ironsmith-compiler = { path = "../ironsmith-compiler", default-features = false }
rayon = "1.12"
csv = "1.4"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "brotli", "cookies", "gzip", "json", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
ironsmith-core = { path = "../ironsmith-core" }
tempfile = "3.27"

[[bin]]
name = "audit_compiled_cards"
path = "src/bin/audit_compiled_cards.rs"
