[package]
name = "ironsmith-tools"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
ironsmith = { package = "ironsmith-runtime", path = "../ironsmith-runtime" }
ironsmith-registry = { path = "../ironsmith-registry" }
ironsmith-compiler = { path = "../ironsmith-compiler" }
rayon = "1.12"
csv = "1.4"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "brotli", "cookies", "gzip", "json", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.27"
toml = "1.1"

[[bin]]
name = "audit_compiled_cards"
path = "src/bin/audit_compiled_cards.rs"
test = false

