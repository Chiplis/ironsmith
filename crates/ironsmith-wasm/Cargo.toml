[package]
name = "ironsmith-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["std"] }
ironsmith-core = { path = "../ironsmith-core" }
ironsmith = { package = "ironsmith-runtime", path = "../ironsmith-runtime", features = ["handwritten-parse-support"] }
ironsmith-compiler = { path = "../ironsmith-compiler" }
ironsmith-registry = { path = "../ironsmith-registry" }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.11"
wasm-bindgen = "0.2.118"
js-sys = "0.3.95"
console_error_panic_hook = "0.1.7"
ziffle = "0.1.0"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["generated-registry"]
generated-registry = ["ironsmith/generated-registry"]
wasm = ["ironsmith/wasm"]
wasm-lean = ["ironsmith/wasm-lean"]
