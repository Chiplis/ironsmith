[package]
name = "ironsmith-engine-wasm"
version = "0.1.2"
edition = "2024"
build = "build.rs"

[dependencies]
# Browser sessions must support custom-card preview and creation even when the
# build uses --no-default-features (as the lean rebuild does).
ironsmith-web-session = { path = "../ironsmith-web-session", default-features = false, features = ["dynamic-compile"] }

[lib]
path = "src/binding.rs"
crate-type = ["cdylib"]

[features]
default = ["generated-registry", "dynamic-compile"]
generated-registry = ["ironsmith-web-session/generated-registry"]
dynamic-compile = ["ironsmith-web-session/dynamic-compile"]
wasm = ["ironsmith-web-session/wasm"]
wasm-lean = ["ironsmith-web-session/wasm-lean"]
shadow-continuous = ["ironsmith-web-session/shadow-continuous"]
paranoid-invariants = ["ironsmith-web-session/paranoid-invariants"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
