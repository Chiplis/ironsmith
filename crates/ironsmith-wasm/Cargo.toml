[package]
name = "ironsmith-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
ironsmith-core = { path = "../ironsmith-core" }
ironsmith = { package = "ironsmith-runtime", path = "../ironsmith-runtime", features = ["compiler-integration"] }
ironsmith-compiler = { path = "../ironsmith-compiler" }
ironsmith-registry = { path = "../ironsmith-registry" }
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[lib]
path = "src/lib.rs"

[features]
default = ["generated-registry"]
generated-registry = []
