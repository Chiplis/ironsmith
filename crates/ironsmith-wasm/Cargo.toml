[package]
name = "ironsmith-wasm"
version = "0.1.2"
edition = "2024"

[dependencies]
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["std"] }
ironsmith-core = { path = "../ironsmith-core" }
ironsmith = { package = "ironsmith-runtime", path = "../ironsmith-runtime", features = ["handwritten-parse-support"] }
ironsmith-compiler = { path = "../ironsmith-compiler" }
ironsmith-registry = { path = "../ironsmith-registry" }
manabrew-protocol = { git = "https://github.com/witchesofthehill/manabrew.git" }
rand = "0.10.1"
rand_chacha = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.11"
ts-rs = { version = "10.1.0", features = ["no-serde-warnings"] }
wasm-bindgen = "0.2.120"
js-sys = "0.3.97"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
ziffle = "0.1.0"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["generated-registry"]
generated-registry = ["ironsmith/generated-registry"]
wasm = ["ironsmith/wasm"]
wasm-lean = ["ironsmith/wasm-lean", "ironsmith-registry/wasm-lean"]
shadow-continuous = ["ironsmith/shadow-continuous"]
paranoid-invariants = ["ironsmith/paranoid-invariants"]
