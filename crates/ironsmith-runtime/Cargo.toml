[package]
name = "ironsmith-runtime"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false

[lib]
name = "ironsmith"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
ironsmith-core = { path = "../ironsmith-core" }
ironsmith-compiler = { path = "../ironsmith-compiler", optional = true }
stacker = "0.1"
rand = "0.9.2"
rayon = "1.10"
logos = "0.16.1"
winnow = { version = "1.0.1", default-features = false, features = ["std", "ascii"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
js-sys = { version = "0.3", optional = true }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
ironsmith-compiler = { path = "../ironsmith-compiler" }

[features]
default = ["serialization", "engine-integration-tests"]
serialization = ["dep:serde", "dep:serde_json"]
generated-registry = []
engine-integration-tests = []
handwritten-parse-support = []
compiler-integration = ["dep:ironsmith-compiler"]
parser-tests = ["compiler-integration"]
parser-tests-full = ["parser-tests", "handwritten-parse-support"]
wasm = [
    "serialization",
    "generated-registry",
    "dep:wasm-bindgen",
    "dep:serde-wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:getrandom",
    "dep:js-sys",
]
