[package]
name = "ironsmith-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
engine = { package = "ironsmith-engine", path = "../ironsmith-engine", default-features = false }
ironsmith-text = { path = "../ironsmith-text", default-features = false }
ironsmith-runtime-catalog = { path = "../ironsmith-runtime-catalog", default-features = false }

[lib]
name = "ironsmith"
path = "src/lib.rs"
crate-type = ["rlib"]
doctest = false

[features]
default = ["serialization", "analysis", "compiler-bridge"]
serialization = ["engine/serialization"]
analysis = ["engine/analysis"]
compiler-bridge = ["engine/compiler-bridge"]
generated-registry = ["engine/generated-registry"]
engine-integration-tests = ["engine/engine-integration-tests"]
handwritten-parse-support = ["engine/handwritten-parse-support"]
bench-support = ["engine/bench-support"]
shadow-continuous = ["engine/shadow-continuous"]
paranoid-invariants = ["engine/paranoid-invariants"]
dhat-heap = ["engine/dhat-heap"]
wasm = ["engine/wasm"]
wasm-lean = ["engine/wasm-lean"]
