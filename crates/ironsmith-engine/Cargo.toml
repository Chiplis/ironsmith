path = "tests/u002_companion.rs"

[[test]]
name = "u068_attack_direction"
path = "tests/u068_attack_direction.rs"

[[example]]
name = "complex_layer_cake_report"
required-features = ["bench-support"]

[features]
default = []
serialization = ["dep:serde", "dep:serde_json"]
analysis = ["dep:ironsmith-semantic-compare"]
effect-model-interpreter = []
artifact-codec = ["serialization", "effect-model-interpreter"]
compiler-bridge = ["serialization", "effect-model-interpreter"]
generated-registry = []
engine-integration-tests = []
handwritten-parse-support = []
bench-support = []
shadow-continuous = ["serialization"]
paranoid-invariants = []
dhat-heap = []
wasm = [
    "serialization",
    "effect-model-interpreter",
    "generated-registry",
    "dep:getrandom",
]
wasm-lean = [
    "serialization",
    "effect-model-interpreter",
    "dep:getrandom",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(ironsmith_runtime_parser_tests)",
    "cfg(ironsmith_runtime_legacy_parser_unit_tests)",
    "cfg(ironsmith_runtime_inline_compiler_runtime)",
    "cfg(ironsmith_runtime_removed_parser_helper_unit_tests)",
] }
