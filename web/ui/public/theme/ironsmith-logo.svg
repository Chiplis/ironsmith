<svg xmlns="http://www.w3.org/2000/svg" id="working" viewBox="0 0 1254 1254" role="img" aria-labelledby="title">
<title id="title">ironSmith blacksmith</title>

<style>
    .sparks { opacity: 0; }
    #working:target .rest-sparks { opacity: 0; }
    /* The forearm turns at the shoulder; the tool turns inside the stationary glove at
       the fist. At impact the outward orange striking face lands at the flat center of the anvil top. */
    #working:target .hammer-arm { animation: strike 2s infinite; transform-origin: 563px 685px; }
    #working:target .hammer-grip { animation: grip 2s infinite; transform-origin: 378px 500px; }
    .working-expression { display: none; }
    #working:target .happy { display: none; }
    #working:target .working-expression { display: inline; }
    #working:target .morph-mouth { animation: mouth-shape 2s ease-in-out infinite; }
    #working:target .morph-brows { animation: brow-shape 2s ease-in-out infinite; }
    #working:target .sparks { animation: sparks 2s infinite; transform-origin: 220px 775px; }
    #working:target .smith-head { animation: head-effort 2s ease-in-out infinite; transform-origin: 760px 690px; }
    @keyframes head-effort {
      0%, 28%, 82%, 100% { transform: translateY(0) rotate(0deg); }
      44%, 51% { transform: translateY(4px) rotate(-3deg); }
    }
    @keyframes strike {
      0%, 12%, 100% { transform: rotate(0deg); }
      28% { transform: rotate(9deg); animation-timing-function: cubic-bezier(.55,0,.9,.45); }
      44% { transform: rotate(-42.3deg); animation-timing-function: ease-out; }
      53% { transform: rotate(-34deg); }
      64% { transform: rotate(-36deg); }
      90% { transform: rotate(0deg); }
    }
    @keyframes grip {
      0%, 12%, 100% { transform: rotate(0deg); }
      28% { transform: rotate(3deg); animation-timing-function: cubic-bezier(.55,0,.9,.45); }
      44% { transform: rotate(-78.7deg); animation-timing-function: ease-out; }
      53% { transform: rotate(-66deg); }
      64% { transform: rotate(-68deg); }
      90% { transform: rotate(0deg); }
    }
    /* One mouth and one pair of brows deform continuously. Hold the relaxed
       pose before the cycle boundary so the loop never swaps faces. */
    @keyframes mouth-shape {
      0%, 28%, 84%, 100% { d: path("M680 594 C688 612 704 616 718 605"); }
      43%, 54% { d: path("M680 615 C692 602 706 606 718 622"); }
    }
    @keyframes brow-shape {
      0%, 28%, 84%, 100% { d: path("M619 448 Q641 441 664 458 M798 489 Q821 480 844 494"); }
      43%, 54% { d: path("M619 456 Q641 466 664 476 M798 509 Q821 501 844 493"); }
    }
    @keyframes sparks {
      0%, 43.9% { opacity: 0; transform: scale(.3); }
      44% { opacity: 1; transform: scale(.55); }
      49% { opacity: 1; transform: scale(1.2); }
      56% { opacity: 1; transform: scale(1.35); }
      66%, 100% { opacity: 0; transform: scale(1.65); }
    }
    @media (prefers-reduced-motion: reduce) {
      #working:target .rest-sparks { opacity: 1; }
      #working:target .working-expression { display: none; }
      #working:target .happy { display: inline; }
      #working:target .hammer-arm, #working:target .hammer-grip,
      #working:target .smith-head, #working:target .morph-mouth, #working:target .morph-brows, #working:target .sparks { animation: none; }
    }
</style>
