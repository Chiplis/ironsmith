[workspace]
members = [
    "vendor/manabrew-protocol",
    "crates/ironsmith-tag-walk-derive",
    "crates/ironsmith-card-source",
    "crates/ironsmith-card-catalog",
    "crates/ironsmith-artifact-baker",
    "crates/ironsmith-compiled-artifact",
    "crates/ironsmith-artifact-effect-decoder",
    "crates/ironsmith-status-db",
    "crates/ironsmith-registry-sync",
    "crates/ironsmith-core",
    "crates/ironsmith-compiler-api",
    "crates/ironsmith-compiler-syntax",
    "crates/ironsmith-compiler-source",
    "crates/ironsmith-compiler-ast",
    "crates/ironsmith-compiler-semantic",
    "crates/ironsmith-compiler-resolve",
    "crates/ironsmith-grammar-common",
    "crates/ironsmith-compiler-grammar",
    "crates/ironsmith-compiler-lowering",
    "crates/ironsmith-semantic-compare",
    "crates/ironsmith-runtime-catalog",
    "crates/ironsmith-engine",
    "crates/ironsmith-runtime",
    "crates/ironsmith-text",
    "crates/ironsmith-compiler",
    "crates/ironsmith-compiler-runtime",
    "crates/ironsmith-dynamic-compile",
    "crates/ironsmith-registry",
    "crates/ironsmith-web-session",
    "crates/ironsmith-wasm",
    "crates/ironsmith-wasm-facade",
    "crates/ironsmith-compiler-wasm",
    "crates/ironsmith-verifier",
    "crates/ironsmith-verifier-ziffle",
    "crates/ironsmith-verifier-wasm-api",
    "crates/ironsmith-verifier-wasm",
    "crates/ironsmith-cli",
    "crates/ironsmith-tools",
]
default-members = [
    "crates/ironsmith-card-source",
    "crates/ironsmith-compiled-artifact",
    "crates/ironsmith-status-db",
    "crates/ironsmith-core",
    "crates/ironsmith-runtime",
    "crates/ironsmith-compiler",
    # "crates/ironsmith-registry",
    # "crates/ironsmith-wasm",
    # "crates/ironsmith-cli",
]
resolver = "2"

[profile.dev]
incremental = true

[profile.release]
lto = false
codegen-units = 16
incremental = true

# These crates are executed only for the lightweight native registry preflight.
# Keeping them cheap to code-generate does not slow the card compiler or baker.
[profile.release.package.ironsmith-card-source]
opt-level = 0

[profile.release.package.ironsmith-status-db]
opt-level = 0

[profile.release.package.ironsmith-registry-sync]
opt-level = 0

[profile.release.package.rusqlite]
opt-level = 0

# The browser pipeline always runs Binaryen over every linked module. Running
# LLVM's full optimizer over the large Rust bodies first duplicates minutes of
# work, but applying those overrides to native release tools makes the corpus
# baker dramatically slower. Keep native `release` optimized and reserve these
# fast-codegen inputs for the wasm build's explicit custom profile.
[profile.wasm-release]
inherits = "release"

[profile.wasm-release.package.ironsmith-compiler]
opt-level = 0

[profile.wasm-release.package.ironsmith-core]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-syntax]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-source]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-ast]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-semantic]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-resolve]
opt-level = 0

[profile.wasm-release.package.ironsmith-grammar-common]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-grammar]
opt-level = 0

[profile.wasm-release.package.ironsmith-engine]
opt-level = 0

[profile.wasm-release.package.ironsmith-runtime-catalog]
opt-level = 1

[profile.wasm-release.package.ironsmith-web-session]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiled-artifact]
opt-level = 0

# The typed effect decoder owns the large serde monomorphization set used to
# decode compiled effects. Binaryen optimizes its linked browser code in the
# shipped pipeline; LLVM optimization here costs more cold wall time than it
# saves downstream.
[profile.wasm-release.package.ironsmith-artifact-effect-decoder]
opt-level = 0

# The artifact baker (`./rebuild-wasm.sh` card bake). At opt-level 2 and 3 a
# non-incremental build runs rustc's MIR inliner, whose metadata pass alone
# costs the engine minutes of single-threaded frontend time. opt-level 1 skips
# it: the cold baker build drops from ~8 to ~5 minutes while the bake itself
# slows by about a minute, which is a net win on every fresh rebuild. The bake
# never executes engine code (only its types), so the engine is not optimized
# at all. (Generic serde code is instantiated in the crates that call it, so
# those keep opt-level 1 even where their own code is cold.)
[profile.artifact-bake]
inherits = "release"

[profile.artifact-bake.package.ironsmith-engine]
opt-level = 0

[profile.artifact-bake.package.ironsmith-compiler-grammar]
opt-level = 1

[profile.artifact-bake.package.ironsmith-text]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiler-lowering]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiler-semantic]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiler-resolve]
opt-level = 1

[profile.artifact-bake.package.ironsmith-core]
opt-level = 1

[profile.artifact-bake.package.ironsmith-artifact-effect-decoder]
opt-level = 1

[profile.artifact-bake.package.ironsmith-runtime-catalog]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiled-artifact]
opt-level = 1

[profile.artifact-bake.package.ironsmith-grammar-common]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiler]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiler-syntax]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiler-source]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiler-ast]
opt-level = 1

[profile.artifact-bake.package.ironsmith-compiler-api]
opt-level = 1

[profile.artifact-bake.package.ironsmith-artifact-baker]
opt-level = 1

# Shipped browser build (`./rebuild-wasm.sh --release`). Download size wins over
# compile time here: whole-program LTO in one codegen unit lets LLVM drop and
# merge code across every crate before Binaryen's -Oz pass. The wasm-release
# package overrides above do not apply here.
[profile.wasm-dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

# `inherits` carries release's package overrides; undo the one in the wasm graph.
[profile.wasm-dist.package.ironsmith-card-source]
opt-level = "z"

# The engine crate is the head of the release build's critical path (engine,
# then the single-threaded fat-LTO links). In one codegen unit its pre-LTO
# optimization alone took ~270 s on one core; four units bring that to ~95 s
# for about 2% (~0.8 MB) more optimized code in each of the engine and
# compiler modules. Sixteen units saved another ~30 s but cost 5%.
[profile.wasm-dist.package.ironsmith-engine]
codegen-units = 4
