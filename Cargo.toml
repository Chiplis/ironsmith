default-members = [
    "crates/ironsmith-card-source",
    "crates/ironsmith-compiled-artifact",
    "crates/ironsmith-status-db",
    "crates/ironsmith-core",
    "crates/ironsmith-runtime",
    "crates/ironsmith-compiler",
    # "crates/ironsmith-registry",
    # "crates/ironsmith-wasm",
    # "crates/ironsmith-cli",
]
resolver = "2"

[profile.release]
lto = false
codegen-units = 16
incremental = false

# These crates are executed only for the lightweight native registry preflight.
# Keeping them cheap to code-generate does not slow the card compiler or baker.
[profile.release.package.ironsmith-card-source]
opt-level = 0

[profile.release.package.ironsmith-status-db]
opt-level = 0

[profile.release.package.ironsmith-registry-sync]
opt-level = 0

[profile.release.package.rusqlite]
opt-level = 0

# The browser pipeline always runs Binaryen over every linked module. Running
# LLVM's full optimizer over the large Rust bodies first duplicates minutes of
# work, but applying those overrides to native release tools makes the corpus
# baker dramatically slower. Keep native `release` optimized and reserve these
# fast-codegen inputs for the wasm build's explicit custom profile.
[profile.wasm-release]
inherits = "release"

[profile.wasm-release.package.ironsmith-compiler]
opt-level = 0

[profile.wasm-release.package.ironsmith-core]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-syntax]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-source]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-ast]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-semantic]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-resolve]
opt-level = 0

[profile.wasm-release.package.ironsmith-grammar-common]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiler-grammar]
opt-level = 0

[profile.wasm-release.package.ironsmith-engine]
opt-level = 0

[profile.wasm-release.package.ironsmith-runtime-catalog]
opt-level = 1

[profile.wasm-release.package.ironsmith-web-session]
opt-level = 0

[profile.wasm-release.package.ironsmith-compiled-artifact]
opt-level = 0

# These independent families own the large serde monomorphization set used to
# decode compiled effects. Binaryen optimizes their linked browser code in the
# shipped pipeline; LLVM optimization here costs more cold wall time than it
# saves downstream.
[profile.wasm-release.package.ironsmith-runtime-effect-zone-library]
opt-level = 0
[profile.wasm-release.package.ironsmith-runtime-effect-player]
opt-level = 0
[profile.wasm-release.package.ironsmith-runtime-effect-resources]
opt-level = 0
[profile.wasm-release.package.ironsmith-runtime-effect-permanent]
opt-level = 0
[profile.wasm-release.package.ironsmith-runtime-effect-combat]
opt-level = 0
[profile.wasm-release.package.ironsmith-runtime-effect-stack-event]
opt-level = 0
[profile.wasm-release.package.ironsmith-runtime-effect-composition-a-l]
opt-level = 0
[profile.wasm-release.package.ironsmith-runtime-effect-composition-m-z]
opt-level = 0

# Deck-count specialization is deliberately spread across sixteen sibling
# leaves. Keep the arithmetic dependency optimized, but defer specialization
# cleanup to the shipped Binaryen pass; per-leaf LLVM work otherwise delays
# ready engine and compiler crates on an eight-core cold build.
[profile.wasm-release.package.ironsmith-verifier-shard-02-07]
opt-level = 0
[profile.wasm-release.package.ironsmith-verifier-shard-08-13]
opt-level = 0
